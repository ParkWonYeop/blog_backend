name: Deploy Blog Backend

permissions:
  contents: read

concurrency:
  group: blog-backend-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and build backend
        run: ./gradlew clean check bootJar --no-daemon

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile Maia engine bridge
        run: python -m py_compile maia-engine/app/main.py

      - name: Package deployment files
        run: |
          set -euo pipefail
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf maia-engine.tar.gz \
            maia-engine

      - name: Upload verified deployment files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blog-backend-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            build/libs/*.jar
            maia-engine.tar.gz
            deploy/deploy.sh
            deploy/systemd/maia-engine.service

  deploy:
    runs-on: self-hosted
    needs: test
    timeout-minutes: 45
    environment: production
    steps:
      - name: Recover interrupted Maia installation
        shell: bash
        run: |
          set -euo pipefail
          active_exec="$(systemctl show -p ExecStart --value maia-engine.service 2>/dev/null || true)"
          if [ -d /opt/blog-backend/maia-engine-venv ] && [[ "$active_exec" != *"/opt/blog-backend/maia-engine-venv/"* ]]; then
            rm -rf /opt/blog-backend/maia-engine-venv
          fi
          if command -v python3 >/dev/null 2>&1; then
            python3 -m pip cache purge || true
          fi

      - name: Download verified deployment files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: blog-backend-${{ github.sha }}

      # 러너가 배포 대상 서버에서 직접 실행되므로 SSH 없이 로컬 배포한다.
      - name: Deploy backend and Maia engine
        run: |
          set -euo pipefail

          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | sort | head -n 1)"
          if [ -z "$jar_file" ]; then
            echo "No boot jar found under build/libs"
            exit 1
          fi

          cp "$jar_file" /tmp/blog-backend.jar.new
          cp maia-engine.tar.gz /tmp/maia-engine.tar.gz.new
          cp deploy/systemd/maia-engine.service /tmp/maia-engine.service.new

          REMOTE_DIR='/root/blog-backend' \
          MAIA_REMOTE_DIR='/opt/blog-backend' \
          SERVICE_NAME='blog-api.service' \
          MAIA_SERVICE_NAME='maia-engine.service' \
          JAR_NAME='blog-backend.jar' \
          REMOTE_TMP='/tmp/blog-backend.jar.new' \
          MAIA_ARCHIVE_TMP='/tmp/maia-engine.tar.gz.new' \
          MAIA_SERVICE_TMP='/tmp/maia-engine.service.new' \
          bash deploy/deploy.sh
